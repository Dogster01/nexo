<style>:root{--bg:#070b14;--bg2:#0c1322;--card:#111a2e;--card2:#16223b;--line:#22314f;--tx:#e6edf7;--mut:#8a9bb8;--acc:#22d3ee;--acc2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bad:#f43f5e;--red:#ff3b5c;--gold:#f5b942}

input,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}

.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:not-allowed}

.namebox{max-width:420px;margin:24px auto 0;text-align:left}
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}

.s0{background:#f43f5e22;color:#fb7185}.s1{background:#a78bfa22;color:#c4b5fd}.s2{background:#fbbf2422;color:#fcd34d}.s3{background:#22d3ee22;color:#67e8f9}.s4{background:#60a5fa22;color:#93c5fd}.s5{background:#34d39922;color:#6ee7b7}.s6{background:#ffffff14;color:#cbd5e1}

.bar{height:10px;border-radius:99px;background:#ffffff10;overflow:hidden;display:flex}

.f-base{background:#475569}.f-own{background:#22d3ee}.f-x{background:#a78bfa}.f-ext{background:#f5b942}.f-ads{background:#fb7185}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.verdict{padding:16px;border-radius:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.verdict .big{font-size:34px}
.v-ok{background:#34d39914;border:1px solid #34d39955}.v-mid{background:#fbbf2414;border:1px solid #fbbf2455}.v-no{background:#f43f5e14;border:1px solid #f43f5e55}
.note{font-size:12.5px;padding:8px 10px;border-radius:10px;background:#ffffff07;margin-bottom:6px;line-height:1.45}
.reco{border:1px dashed var(--gold);background:#f5b9420d;border-radius:12px;padding:12px;margin:10px 0}
.price{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.price div{background:var(--bg2);border-radius:10px;padding:10px}.price small{color:var(--mut);font-size:11px}.price b{display:block;font-size:17px}

.oc{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--bg2)}
.oc .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:4px;margin:10px 0}

.auto{font-size:12px;color:#b6c4dc;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px}

.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:#0b1222;border:1px solid var(--line);border-radius:18px;width:min(1250px,100%);max-height:94vh;overflow:auto;padding:18px;box-shadow:0 30px 80px #000}
.pipe{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.pipe div{flex:1;min-width:110px;padding:10px;border-radius:12px;background:#ffffff08;border:1px solid var(--line);font-size:12px;text-align:center;opacity:.55}
.pipe div.d{opacity:1;border-color:#34d39966;background:#34d39912}
.pipe div.c{opacity:1;border-color:var(--acc);background:#22d3ee18;box-shadow:0 0 18px #22d3ee33}
.pipe div b{display:block;font-size:18px;margin-bottom:3px}
.mgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.typing:after{content:"▋";animation:blink 1s infinite;color:var(--acc)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f1a30;border:1px solid var(--acc);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 10px 30px #000;max-width:92vw}
.qr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.qr img{width:100%;max-width:190px;background:#fff;padding:8px;border-radius:12px}
.scanbox{height:300px;overflow:hidden;font-size:12px;display:flex;flex-direction:column;gap:4px}
.scan{display:flex;gap:10px;align-items:center;padding:6px 8px;background:#ffffff07;border-radius:8px;animation:in .3s}
.qrmini{width:26px;height:26px;flex:none;background:#fff;border-radius:3px;padding:2px;display:grid;grid-template-columns:repeat(5,1fr);gap:1px}

.laser{height:3px;background:linear-gradient(90deg,transparent,#f43f5e,transparent);box-shadow:0 0 12px #f43f5e;animation:laser 1.2s ease-in-out infinite alternate;margin:8px 0}

.src a{color:var(--acc);text-decoration:none}
.fact{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}

.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.est{font-size:10px;color:var(--warn);font-weight:700;letter-spacing:.5px}
.plat{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;padding:6px 0}

.cal{user-select:none}.cal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}

.tline{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid #ffffff0a}
.tline .dt{width:12px;height:12px;border-radius:50%;background:#ffffff22;border:2px solid var(--line)}
.tline.d .dt{background:var(--ok);border-color:var(--ok)}.tline.c .dt{background:var(--acc);border-color:var(--acc);animation:blink 1s infinite}
.via{display:flex;align-items:center;gap:0;margin:10px 0;flex-wrap:wrap;row-gap:8px}

.req{border:1px solid var(--gold);background:#f5b9420f;border-radius:14px;padding:12px;margin-bottom:10px;animation:in .4s}
.chat{display:flex;flex-direction:column;gap:6px;margin-top:8px}.chat div{padding:8px 10px;border-radius:10px;font-size:12.5px;max-width:92%}

.pulse{animation-duration:1s}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
#print{display:none}
@media print{body>*{display:none!important}#print{display:block!important;color:#111;background:#fff;font-size:11px}body{background:#fff}}

/* ---------- descuentos: decisión de gerencia ---------- */
function discSim(r, pct) {
  const q0 = quote(Object.assign({}, r, { disc2: 0 }), true), q1 = quote(Object.assign({}, r, { disc2: pct }), true);

  return { q0, q1, lvl, maxOk };
}
function managerDecision(r, pct) {
  const s = discSim(r, pct);
  if (pct <= 5) return { ok: true, pct, by: 'Asesor', msg: `Aplicado directo: ${pct}% está dentro de tu autonomía.` };
  if (pct <= 10 && s.q1.margin >= 30) return { ok: true, pct, by: 'Coordinador (NEXO)', msg: `Aprobado automáticamente: el margen queda en ${s.q1.margin}%.` };
  if (s.q1.margin >= MIN_MARGIN) return { ok: true, pct, by: 'Gerencia comercial', msg: `Aprobado ${pct}%. Margen final ${s.q1.margin}%, utilidad ${mm(s.q1.price - s.q1.cost)}.` };
  // contraoferta: más plazo (más flota propia, más barato) o descuento menor
  const alt = quote(Object.assign({}, r, { disc2: pct, ext: false, extra: false, flex: Math.max(2, typeof r.flex === 'number' ? r.flex : 2), mode: 'std' }), true);
  if (alt.ok && alt.margin >= MIN_MARGIN) return { ok: 'counter', pct, cond: { ext: false, extra: false, flex: Math.max(2, typeof r.flex === 'number' ? r.flex : 2), mode: 'std' }, by: 'Gerencia comercial', msg: `Damos el ${pct}% si el cliente acepta ${Math.max(2, r.flex || 2)} días de plazo sin externos (usamos flota propia, más barata). Margen ${alt.margin}%.` };
  if (s.maxOk > 0) return { ok: 'counter', pct: s.maxOk, by: 'Gerencia comercial', msg: `Con ${pct}% el margen baja a ${s.q1.margin}% (mínimo ${MIN_MARGIN}%). Contraoferta: ${s.maxOk}% + pago a 15 días.` };
  return { ok: false, pct: 0, by: 'Gerencia comercial', msg: `No es posible: el margen ya está al límite (${s.q0.margin}%). Ofrece valor: rastreo en vivo y prioridad en temporada.` };
}

/* ---------- estado en el tiempo (hora simulada) ---------- */

/* ===================== SINCRONIZACIÓN ===================== */
function setAt(path, data, patch) {
  invalidate();
  const p = path.split('/').filter(Boolean);
  if (patch) { for (const k in data) setAt(path.replace(/\/$/, '') + '/' + k, data[k]); return; }
  if (!p.length) { R = (data && typeof data === 'object') ? data : {}; return; }
  let o = R; for (let i = 0; i < p.length - 1; i++) { if (typeof o[p[i]] !== 'object' || o[p[i]] === null) o[p[i]] = {}; o = o[p[i]]; }
  const last = p[p.length - 1]; if (data === null) delete o[last]; else o[last] = data;
}
let bc = null; try { bc = new BroadcastChannel('nexo'); bc.onmessage = e => setAt(e.data.path, e.data.data); } catch (e) { }
let saveT = 0;
function saveLocal() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('nexo_db', JSON.stringify(R)); } catch (e) { } }, 800); }
function dbPut(path, data) {
  setAt(path, data);
  if (MODE === 'live') fetch(FB + path + '.json', { method: 'PUT', body: JSON.stringify(data) }).catch(() => { });
  else { if (bc) bc.postMessage({ path, data }); saveLocal(); }
}
function goLocal() { if (MODE === 'local') return; MODE = 'local'; try { const s = localStorage.getItem('nexo_db'); if (s) R = JSON.parse(s); } catch (e) { } }
function connect() {
  if (location.search.includes('demo=1') || !window.EventSource) { goLocal(); return; }
  let got = false;
  try {
    const es = new EventSource(FB + '.json');
    const to = setTimeout(() => { if (!got) { es.close(); goLocal(); } }, 7000);
    es.addEventListener('put', e => { const m = JSON.parse(e.data); if (!got) { got = true; clearTimeout(to); MODE = 'live'; } setAt(m.path, m.data); });
    es.addEventListener('patch', e => { const m = JSON.parse(e.data); setAt(m.path, m.data, true); });
    es.onerror = () => { if (!got) { clearTimeout(to); es.close(); goLocal(); } };
  } catch (e) { goLocal(); }
}

  const t = todayOrders(), h = t.reduce((s, o) => s + savedMin(o), 0) / 60;
  nexoPop('En este momento NEXO…', `${esc(l.x)}<div class="mut" style="margin-top:6px">Hoy lleva ${fmt(t.length)} órdenes planeadas solo, ${fmt(h)} h humanas ahorradas (${mm(h * FIN.coordH)}).</div>`);
}
function jumpBy(ms, label) {
  const from = vnow(), to = from + ms; jumpClock(ms); FEEDSEEN = new Set(); if ($('#feed')) $('#feed').innerHTML = '';
  let ent = 0, sal = 0, rep = 0, rec = 0; for (const o of orders()) { const tl = tlOf(o); if (tl[6] > from && tl[6] <= to) ent++; if (o.lh && tl[3] > from && tl[3] <= to) sal++; if (tl[5] > from && tl[5] <= to) rep++; if (tl[2] > from && tl[2] <= to) rec++; }
  nexoPop(`⏩ Adelantamos ${label}`, `Mientras tanto NEXO, sin nadie al teléfono:<br>🏭 inició ${rec} recolecciones<br>🚛 despachó ${sal} viajes nacionales<br>🛵 sacó ${rep} órdenes a reparto<br>🏁 entregó ${ent} órdenes<div class="mut" style="margin-top:6px">Ahora son las ${when(to)}</div>`, 9000);
}
function runScn(k) { const o = SCN[k].run(); nexoPop('🎬 Escenario: ' + SCN[k].t.replace(/^[^ ]+ /, ''), `${esc(o.asesor)} acaba de registrar la venta. Mira cómo NEXO la negocia, la planea y la ejecuta.`, 6000); setTimeout(() => openOrder(o.id), 500); }

function nextStage(id) {
  const o = (R.orders || {})[id]; if (!o) return; const tl = tlOf(o), now = vnow(), nx = tl.find(t => t > now + 1000); if (!nx) return;
  const s0 = stageOf(o, now).i; jumpClock(nx - now + 60000);
  setTimeout(() => { const s = stageOf(o).i, L = thoughts(o).filter(l => l.t <= vnow() && l.t > now); nexoPop(`${STAGE_IC[s]} ${STAGES[s]}`, L.slice(-2).map(l => esc(l.x)).join('<br><br>') + `<div class="mut" style="margin-top:6px">${when(vnow())} · ${esc(trackPos(o).txt)}</div>`, 9000); }, 300);
}

function renderOpt() {
  const el = $('#opt'); if (!el) return; const act = recentOrders().filter(o => stageOf(o).i < 6);
  const tr = act.filter(o => stageOf(o).i === 3 && o.lh), rep = act.filter(o => stageOf(o).i === 5), f = act.reduce((s, o) => { const x = fleetOf(o); s.v += x.drivers; s.e += x.extR; return s; }, { v: 0, e: 0 });
  const km = act.reduce((s, o) => s + (o.lh ? o.lh.km : 25), 0), kmSave = km * 0.14, fuel = kmSave * 0.32, co2 = fuel * 2.68, t = todayOrders();
  const gain = t.reduce((s, o) => s + o.price - o.cost, 0), hrsS = t.reduce((s, o) => s + savedMin(o), 0) / 60;
  setHTML(el, `<div class="kpis" style="grid-template-columns:1fr 1fr">${kpi('Viajes en carretera/aire', fmt(tr.length), 'rastreados por GPS')}${kpi('Órdenes en reparto', fmt(rep.length), fmt(f.v) + ' vehículos propios · ' + fmt(f.e) + ' rutas externas')}${kpi('Km ahorrados', fmt(kmSave), 'rutas optimizadas (−14%)')}${kpi('Combustible ahorrado', fmt(fuel) + ' gal', mm(fuel * 16500) + ' · ' + fmt(co2) + ' kg CO₂')}${kpi('Ganancia protegida hoy', mm(gain), 'nada vendido sin capacidad')}${kpi('Horas de coordinación', fmt(hrsS) + ' h', 'que nadie tuvo que hacer')}</div>
  <h3 style="margin-top:10px">🚛 Viajes en curso</h3>${tr.slice(0, 7).map(o => { const s = stageOf(o), tl = tlOf(o); return `<div class="oc" style="cursor:pointer;padding:9px" onclick="openOrder('${o.id}')"><div class="row"><b style="font-size:12.5px">${o.lh.air ? '✈️' : '🚛'} ${esc(o.cliente)}</b><span class="mono" style="font-size:11px">ETA ${hhmm(tl[4])}</span></div><div class="mut" style="font-size:11.5px">${esc(trackPos(o).txt)}</div><div class="bar" style="margin-top:5px"><i class="f-own" style="width:${Math.round(s.f * 100)}%"></i></div></div>`; }).join('') || '<div class="mut">Ningún viaje nacional en este momento. Usa ⏩ en el panel administrador.</div>'}`);
}
