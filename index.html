<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXO · IA de capacidad logística para TCC</title>
<meta name="theme-color" content="#070b14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2.5 35.5 11.2v17.6L20 37.5 4.5 28.8V11.2Z' fill='%23070b14' stroke='%2322d3ee' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%23a78bfa'/%3E%3C/svg%3E">
<style>:root{--bg:#070b14;--bg2:#0c1322;--card:#111a2e;--card2:#16223b;--line:#22314f;--tx:#e6edf7;--mut:#8a9bb8;--acc:#22d3ee;--acc2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bad:#f43f5e;--red:#ff3b5c;--gold:#f5b942}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#12305044,transparent),radial-gradient(900px 500px at -10% 110%,#2a1b5544,transparent),var(--bg)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label{font-size:12px;color:var(--mut);display:block;margin:0 0 5px}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mut{color:var(--mut)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--acc)}
.btn{background:linear-gradient(135deg,#0891b2,#7c3aed);padding:11px 16px;border-radius:12px;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 20px #22d3ee22}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{background:var(--card2);border:1px solid var(--line);padding:9px 13px;border-radius:10px;font-weight:600}
.btn2:hover{border-color:var(--acc)}
.btn-star{background:linear-gradient(135deg,#f59e0b,#ef4444);padding:9px 14px;border-radius:12px;font-weight:800;box-shadow:0 0 0 0 #f59e0b88;animation:glow 2.2s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 #f59e0b77}70%{box-shadow:0 0 0 12px #f59e0b00}100%{box-shadow:0 0 0 0 #f59e0b00}}
.card{background:linear-gradient(180deg,var(--card),#0e1628);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#ffffff10;border:1px solid #ffffff18}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.live{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
/* topbar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#070b14cc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:3px}
.logo .mk{width:34px;height:34px}
.top .sp{flex:1}
.clock{font-weight:800;font-size:15px}
/* login */
.login{max-width:980px;margin:0 auto;padding:40px 18px;text-align:center}
.hero-logo{width:96px;height:96px;margin:0 auto 10px}
.login h1{font-size:54px;letter-spacing:12px;font-weight:900;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f5b942);-webkit-background-clip:text;background-clip:text;color:transparent}
.login .tag{font-size:16px;color:#c7d2e6;margin:6px 0 4px}
.login .who{margin:18px 0 28px;color:var(--mut);line-height:1.6}
.login .who b{color:var(--tx);font-size:16px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role{padding:22px 16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#121c33,#0d1527);text-align:center;transition:.2s}
.role:hover{transform:translateY(-3px);border-color:var(--acc)}
.role .ic{font-size:38px;margin-bottom:8px}.role b{display:block;font-size:17px;margin-bottom:4px}.role span{font-size:12px;color:var(--mut)}
.namebox{max-width:420px;margin:24px auto 0;text-align:left}
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.facts .pill{font-size:12px;padding:6px 12px;font-weight:600}
/* layout */
.wrap{padding:14px;max-width:1700px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.kpi small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:3px}
.kpi i{font-style:normal;font-size:11px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{padding:8px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.tab.on{background:linear-gradient(135deg,#0e7490,#6d28d9);border-color:transparent}
/* map */
.mapcard{position:relative;padding:0;overflow:hidden}
.maphead{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:2;align-items:center;flex-wrap:wrap}
#map{width:100%;height:640px;display:block;background:radial-gradient(circle at 50% 40%,#0f2140,#070b14 70%)}
.legend{position:absolute;bottom:10px;left:12px;font-size:11px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;background:#070b14bb;padding:6px 10px;border-radius:10px}
.side-ant{position:absolute;right:10px;top:56px;width:270px;max-height:560px;overflow:auto;background:#070b14dd;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}
.side-ant .it{padding:7px 6px;border-bottom:1px solid #ffffff0d;cursor:pointer;border-radius:8px}
.side-ant .it:hover{background:#ffffff0a}
.pulse{animation:pulse 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
/* brain */
.brain{display:flex;flex-direction:column;height:640px}
.brain .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.orb{width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5f3fc,#22d3ee 30%,#7c3aed 70%,#1e1b4b);box-shadow:0 0 30px #22d3ee66,0 0 60px #7c3aed44;animation:think 2.4s ease-in-out infinite;position:relative}
.orb:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed #22d3ee55;animation:spin 9s linear infinite}
@keyframes think{50%{transform:scale(1.07);filter:hue-rotate(25deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.feed{flex:1;overflow:hidden;font-size:12.5px;line-height:1.45;display:flex;flex-direction:column;gap:5px;mask-image:linear-gradient(180deg,#000 75%,transparent)}
.ln{padding:7px 9px;border-radius:9px;background:#ffffff06;border-left:3px solid var(--acc);animation:in .45s ease}
.ln .t{color:var(--mut);font-size:10.5px;margin-right:6px}
.ln.c2{border-color:var(--acc2)}.ln.c3{border-color:var(--gold)}.ln.c4{border-color:var(--ok)}.ln.c5{border-color:var(--red)}
.ln.click{cursor:pointer}.ln.click:hover{background:#ffffff10}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #ffffff0a}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff07}
.st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.s0{background:#f43f5e22;color:#fb7185}.s1{background:#a78bfa22;color:#c4b5fd}.s2{background:#fbbf2422;color:#fcd34d}.s3{background:#22d3ee22;color:#67e8f9}.s4{background:#60a5fa22;color:#93c5fd}.s5{background:#34d39922;color:#6ee7b7}.s6{background:#ffffff14;color:#cbd5e1}
/* bars */
.bar{height:10px;border-radius:99px;background:#ffffff10;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.capday{display:grid;grid-template-columns:70px 1fr 120px;gap:10px;align-items:center;padding:6px 0;font-size:12px}
.f-base{background:#475569}.f-own{background:#22d3ee}.f-x{background:#a78bfa}.f-ext{background:#f5b942}.f-ads{background:#fb7185}
/* forms */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm .full{grid-column:1/-1}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--bg2)}
.opt input{width:auto;margin-top:3px}
.opt.on{border-color:var(--acc);background:#22d3ee0d}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;background:var(--bg2)}
.chip.on{background:#22d3ee22;border-color:var(--acc);color:#a5f3fc}
.verdict{padding:16px;border-radius:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.verdict .big{font-size:34px}
.v-ok{background:#34d39914;border:1px solid #34d39955}.v-mid{background:#fbbf2414;border:1px solid #fbbf2455}.v-no{background:#f43f5e14;border:1px solid #f43f5e55}
.note{font-size:12.5px;padding:8px 10px;border-radius:10px;background:#ffffff07;margin-bottom:6px;line-height:1.45}
.reco{border:1px dashed var(--gold);background:#f5b9420d;border-radius:12px;padding:12px;margin:10px 0}
.price{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.price div{background:var(--bg2);border-radius:10px;padding:10px}.price small{color:var(--mut);font-size:11px}.price b{display:block;font-size:17px}
/* order cards */
.oc{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--bg2)}
.oc .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:4px;margin:10px 0}
.steps i{flex:1;height:6px;border-radius:9px;background:#ffffff12}
.steps i.d{background:var(--ok)}.steps i.c{background:var(--acc);animation:blink 1s infinite}
.auto{font-size:12px;color:#b6c4dc;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px}
/* modal */
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:#0b1222;border:1px solid var(--line);border-radius:18px;width:min(1250px,100%);max-height:94vh;overflow:auto;padding:18px;box-shadow:0 30px 80px #000}
.pipe{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.pipe div{flex:1;min-width:110px;padding:10px;border-radius:12px;background:#ffffff08;border:1px solid var(--line);font-size:12px;text-align:center;opacity:.55}
.pipe div.d{opacity:1;border-color:#34d39966;background:#34d39912}
.pipe div.c{opacity:1;border-color:var(--acc);background:#22d3ee18;box-shadow:0 0 18px #22d3ee33}
.pipe div b{display:block;font-size:18px;margin-bottom:3px}
.mgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.typing:after{content:"▋";animation:blink 1s infinite;color:var(--acc)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f1a30;border:1px solid var(--acc);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 10px 30px #000;max-width:92vw}
.qr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.qr img{width:100%;max-width:190px;background:#fff;padding:8px;border-radius:12px}
.scanbox{height:300px;overflow:hidden;font-size:12px;display:flex;flex-direction:column;gap:4px}
.scan{display:flex;gap:10px;align-items:center;padding:6px 8px;background:#ffffff07;border-radius:8px;animation:in .3s}
.qrmini{width:26px;height:26px;flex:none;background:#fff;border-radius:3px;padding:2px;display:grid;grid-template-columns:repeat(5,1fr);gap:1px}
.qrmini i{background:#000}.qrmini i.w{background:#fff}
.laser{height:3px;background:linear-gradient(90deg,transparent,#f43f5e,transparent);box-shadow:0 0 12px #f43f5e;animation:laser 1.2s ease-in-out infinite alternate;margin:8px 0}
@keyframes laser{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.src a{color:var(--acc);text-decoration:none}
.fact{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.fact b{font-size:22px;display:block}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.est{font-size:10px;color:var(--warn);font-weight:700;letter-spacing:.5px}
.plat{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;padding:6px 0}
@media (max-width:1000px){.grid2,.mgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}#map,.brain{height:470px}.fgrid{grid-template-columns:1fr 1fr}.side-ant{display:none}}
@media (max-width:640px){.roles{grid-template-columns:1fr}.login h1{font-size:40px}.frm{grid-template-columns:1fr}.price{grid-template-columns:1fr 1fr}.auto{grid-template-columns:1fr}.qr{grid-template-columns:1fr}.capday{grid-template-columns:56px 1fr 92px}}
</style></head>
<body><div id="app"></div>
<script>

// Supuestos estimados (no públicos) — siempre marcados como ESTIMADO
const ESTIMADOS = [

function setAt(path, data, patch) {

  if (!p.length) { R = (data && typeof data === 'object') ? data : {}; return; }
  let o = R; for (let i = 0; i < p.length - 1; i++) { if (typeof o[p[i]] !== 'object' || o[p[i]] === null) o[p[i]] = {}; o = o[p[i]]; }
  const last = p[p.length - 1]; if (data === null) delete o[last]; else o[last] = data;
}

function connect() {
  if (location.search.includes('demo=1') || !window.EventSource) { goLocal(); return; }
  let got = false;
  try {
    const es = new EventSource(FB + '.json');
    const to = setTimeout(() => { if (!got) { es.close(); goLocal(); } }, 7000);
    es.addEventListener('put', e => { const m = JSON.parse(e.data); if (!got) { got = true; clearTimeout(to); MODE = 'live'; } setAt(m.path, m.data); });
    es.addEventListener('patch', e => { const m = JSON.parse(e.data); setAt(m.path, m.data, true); });
    es.onerror = () => { if (!got) { clearTimeout(to); es.close(); goLocal(); } };

  let m = $('#modal'); if (!m) { m = document.createElement('div'); m.id = 'modal'; m.className = 'modal'; m.onclick = e => { if (e.target === m) closeModal(); }; document.body.appendChild(m); m.innerHTML = '<div class="mbox" id="mb"></div>'; }
  const now = Date.now(), s = stageOf(o, now), f = fleetOf(o), L = thoughts(o).filter(l => l.t <= now);
  const pipeNames = ['Comercial', 'NEXO reserva', 'Bodega origen', o.lh ? (o.lh.cont ? 'Puerto → tractomulas' : 'Tractomulas') : 'Tránsito urbano', 'Hub ' + CITIES[o.hub].n, 'Reparto', 'Cliente'];
  const margin = Math.round((1 - o.cost / Math.max(1, o.price)) * 100);
  const html = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div>${o.src === 'star' ? '<span class="pill" style="background:#f59e0b33">⭐ ORDEN ESTRELLA</span> ' : ''}<span class="pill mono">${o.id}</span><h2 style="margin-top:6px">${esc(o.cliente)}</h2><div class="mut">${esc(o.producto)} · ${fmt(o.qty)} paquetes${o.qtyReq && o.qtyReq !== o.qty ? ` (pidió ${fmt(o.qtyReq)})` : ''} · ${o.kg} kg c/u · ${PLACE(o.origin).n} → ${PLACE(o.dest).n} · vendió <b>${esc(o.asesor)}</b></div></div><button class="btn2" onclick="closeModal()">✕ Cerrar</button></div>
  <div class="pipe">${pipeNames.map((n, i) => `<div class="${i < s.i || s.i === 6 ? 'd' : i === s.i ? 'c' : ''}"><b>${STAGE_IC[i]}</b>${n}</div>`).join('')}</div>
  <div class="mgrid"><div class="card"><h3><span class="orb" style="width:26px;height:26px"></span> Así piensa NEXO</h3><div style="display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto" id="mlog">${L.map((l, i) => `<div class="ln c${l.c} ${i === L.length - 1 && now - l.t < 2500 ? 'typing' : ''}"><span class="t mono">${hhmmss(l.t + offH() * 3600e3)}</span>${esc(l.x)}</div>`).join('')}${s.i < 6 ? '<div class="mut typing" style="font-size:12px;padding:4px 8px">procesando</div>' : ''}</div></div>
  <div><div class="card"><h3>🗓️ Plan de entrega reservado</h3>${(o.alloc || []).map(a => { const t = a.own + a.xtra + a.ext + a.ads; return `<div class="capday"><b>${dayLabel(a.off)}</b><div class="bar">${seg(a.own, t, 'f-own')}${seg(a.xtra, t, 'f-x')}${seg(a.ext, t, 'f-ext')}${seg(a.ads, t, 'f-ads')}</div><span class="mono">${fmt(t)}</span></div>`; }).join('')}
   ${o.negot ? `<div class="note">🤝 ${esc(o.negot)}</div>` : ''}
   <div class="auto" style="margin-top:8px"><span>🚐 ${f.nhr} furgones NHR</span><span>⚡ ${f.ev} eléctricos</span><span>🛵 ${f.moto} motos</span><span>🤝 ${f.extR} rutas externas</span><span>👷 ${f.ops} operarios de bodega</span><span>🧑‍✈️ ${f.drivers + f.extR} conductores</span>${o.lh ? `<span>🚛 ${o.lh.trucks} tractomulas · ${o.lh.tons} t</span><span>🛣️ ${fmt(o.lh.km)} km · ${o.lh.h} h</span>${o.lh.cont ? `<span>📦 ${o.lh.cont} contenedores</span>` : ''}` : ''}${o.ads ? `<span>📣 ${money(o.ads.spend)} en anuncios</span><span>🙋 ~${o.ads.hires} postulantes</span>` : ''}</div></div>
  <div class="card" style="margin-top:12px"><h3>💰 Finanzas de la orden</h3><div class="price"><div><small>Precio al cliente</small><b>${mm(o.price)}</b></div><div><small>Costo directo</small><b>${mm(o.cost)}</b></div><div><small>Margen</small><b class="${margin > 20 ? 'ok' : 'warn'}">${margin}%</b></div><div><small>Por paquete</small><b>${money(o.price / Math.max(1, o.qty))}</b></div><div><small>Utilidad neta</small><b>${mm(o.price - o.cost - o.price * FIN.adm)}</b></div><div><small>Horas humanas ahorradas</small><b>${Math.round(savedMin(o) / 6) / 10} h</b></div></div></div></div></div>`;
  $('#mb').innerHTML = html; const ml = $('#mlog'); if (ml) ml.scrollTop = ml.scrollHeight;
}

/* ---------- RUTEO Y LOOP ---------- */
function route() {
  closeModal();
  const pre = new URLSearchParams(location.search).get('r');
  if (!SES) return viewLogin(pre && ['com', 'log', 'adm'].includes(pre) ? pre : null);
  if (SES.role === 'com') viewCom(); else if (SES.role === 'log') viewLog(); else viewAdm();
  tickTop();
}
let lastPres = 0;
function loop() {
  try {
    tickTop();
    if (SES) {
      if (Date.now() - lastPres > 10000) { lastPres = Date.now(); dbPut('/presence/' + ME, { role: SES.role, name: SES.name, ts: Date.now() }); }
      if (SES.role === 'adm') renderAdm();
      if (SES.role === 'log') { if (LTAB === 'in' || LTAB === 'cap') { renderLog(); if (LTAB === 'cap' && $('#lb')._draw && Date.now() % 4000 < 1000) $('#lb')._draw(); } }
      if (SES.role === 'com') { renderMine(); if (Date.now() % 5000 < 1000) renderCapMini(); }
      if (MODAL) renderModal();
    }
  } catch (e) { console.warn(e); }
}
let hostT = 0;
function boot() {
  connect(); route();
  setInterval(loop, 1000);
  setInterval(() => { if (SES && SES.role === 'adm' && MODE !== 'conectando') { const was = isHost; hostTick(); if (isHost && !was) { try { simStep(); } catch (e) { } scheduleSim(); } if (!isHost) clearTimeout(simT); } }, 4000);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}
window.addEventListener('load', boot);

</script></body></html>
